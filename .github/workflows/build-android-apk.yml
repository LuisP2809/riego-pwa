name: APK descargable de Riego

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', 'downloads/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riego-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar acceso, sincronización y mapa
        run: npm test
      - name: Preparar Android
        run: npm run android:init
      - name: Construir APK
        run: |
          chmod +x android/gradlew
          npm run apk:debug
      - name: Verificar APK de actualización
        env:
          RIEGO_CERT_SHA256: d3ddb0a20e478eb21fd628e65e0c0fb99b45cc7ff4fc9b469b8a42bdcafe6c4e
        run: |
          riego_apk_path='android/app/build/outputs/apk/debug/app-debug.apk'
          riego_certificate_report="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$riego_apk_path")"
          printf '%s\n' "$riego_certificate_report"
          if [[ "$riego_certificate_report" != *"Signer #1 certificate SHA-256 digest: $RIEGO_CERT_SHA256"* ]]; then
            echo 'La APK no conserva la firma de las versiones anteriores.'
            exit 1
          fi
          riego_version="$(node -p "require('./package.json').version")"
          riego_version_code="$(node -p "require('./package.json').version.split('.').map(Number).reduce((total, value, index) => total + value * [1000000, 1000, 1][index], 0)")"
          riego_badging_report="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$riego_apk_path")"
          if [[ "$riego_badging_report" != *"package: name='pe.riego.campo' versionCode='$riego_version_code' versionName='$riego_version'"* || "$riego_badging_report" != *"sdkVersion:'26'"* || "$riego_badging_report" != *"targetSdkVersion:'36'"* ]]; then
            echo 'El identificador o la versión Android de la APK no coincide.'
            exit 1
          fi
          riego_manifest_report="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$riego_apk_path" AndroidManifest.xml)"
          if [[ "$riego_manifest_report" != *'android:windowSoftInputMode(0x0101022b)=(type 0x11)0x10'* ]]; then
            echo 'La APK no conserva el ajuste del teclado.'
            exit 1
          fi
          printf 'APK verificada: pe.riego.campo, versión %s, código %s, Android 8+, adjustResize.\n' "$riego_version" "$riego_version_code"
      - name: Preparar descarga
        id: package
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk/Riego-$version.apk"
          cd apk
          sha256sum "Riego-$version.apk" > "Riego-$version.sha256"
      - name: Guardar APK de esta compilación
        uses: actions/upload-artifact@v4
        with:
          name: Riego-APK-${{ steps.package.outputs.version }}
          path: apk/*
          retention-days: 90
          if-no-files-found: error
  release:
    needs: apk
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Riego-APK-${{ needs.apk.outputs.version }}
          path: apk
      - name: Publicar descarga en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RIEGO_VERSION: ${{ needs.apk.outputs.version }}
        run: |
          tag="v$RIEGO_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            existing_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)"
            if [ "$existing_commit" != "$GITHUB_SHA" ]; then
              echo 'Esta versión ya tiene un APK. Aumenta package.json antes de publicar otra versión.'
              exit 1
            fi
            gh release upload "$tag" apk/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" apk/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Riego $RIEGO_VERSION" --notes-file docs/release-notes.md
          fi
